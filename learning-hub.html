<!DOCTYPE html>

    <!-- Import Map for React modules -->
    <script type="importmap">
    {
        "imports": {

        import { createRoot } from 'react-dom/client';
        import {

            X,
            ArrowRight,
            ChevronDown,
            Play,

            TrendingUp,

            Shield,
            Mail,
            ShieldCheck

        import { motion, AnimatePresence } from 'framer-motion';

        const Navbar = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

                    'div',
                    { className: 'container mx-auto px-6 flex justify-between items-center' },

                        'div',

                    transition: { duration: 0.5, delay },
                    className: 'bg-white border border-slate-100 shadow-sm hover:shadow-xl transition-all duration-300 rounded-lg overflow-hidden group'

                    { className: 'relative bg-slate-900 aspect-video flex items-center justify-center cursor-pointer group-hover:bg-slate-800 transition-colors' },

                        { className: 'absolute inset-0 bg-gradient-to-br from-blue-600/20 to-slate-900/80' }

                    React.createElement(

                        { className: 'relative z-10 flex flex-col items-center' },

                    { className: 'container mx-auto px-6' },

                        React.createElement('h2', { className: 'text-3xl md:text-4xl font-serif text-slate-900 mb-4' }, 'Educational Webinars'),
                        React.createElement('p', { className: 'text-slate-600 max-w-2xl mx-auto' }, 'Our library of educational content is designed to help you understand key financial concepts and make informed decisions about your money.')

                        { className: 'grid grid-cols-1 md:grid-cols-2 gap-8' },

                        )
                    )
                )
            );
        };

        const CallToAction = () => {
            return React.createElement(

                { className: 'py-20 bg-slate-900' },
                React.createElement(

                        React.createElement(
                            'a',
                            {
                                href: 'index.html#contact',
                                className: 'inline-flex items-center gap-2 px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-sm transition-all transform hover:-translate-y-0.5 shadow-lg shadow-blue-900/20 group'

                            'Schedule a Virtual Meeting',
                            React.createElement(ArrowRight, { className: 'w-4 h-4 group-hover:translate-x-1 transition-transform' })

            const [subscribed, setSubscribed] = useState(false);

            const handleSubscribe = (e) => {
                e.preventDefault();
                if (email) {
                    setSubscribed(true);
                    setEmail('');
                }
            };

            return React.createElement(
                'footer',
                { className: 'bg-slate-950 text-slate-400 py-12 border-t border-slate-900' },
                React.createElement(
                    'div',
                    { className: 'container mx-auto px-6' },
                    // Email Subscribe Section
                    React.createElement(
                        'div',
                        { className: 'bg-slate-900 rounded-lg p-8 mb-12' },
                        React.createElement(
                            'div',
                            { className: 'max-w-2xl mx-auto text-center' },
                            React.createElement('h4', { className: 'text-2xl font-serif text-white mb-3' }, 'Stay Informed'),
                            React.createElement('p', { className: 'text-slate-400 mb-6' }, 'Subscribe to our newsletter for financial tips, market insights, and updates on our services.'),

                                'div',
                                { className: 'flex items-center justify-center gap-2 text-green-400' },
                                React.createElement(ShieldCheck, { size: 20 }),
                                React.createElement('span', null, 'Thank you for subscribing!')
