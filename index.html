<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Foundations Partners - Website Mockups | Silvermine AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        /* Tab Navigation */
        .tab-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: linear-gradient(180deg, rgba(10, 10, 10, 0.98) 0%, rgba(10, 10, 10, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0 24px;
        }

        .tab-nav-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .logo {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #888;
        }

        .logo span {
            color: #fff;
        }

        .tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #888;
            padding: 10px 24px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
            font-family: inherit;
        }

        .tab-btn:hover {
            border-color: rgba(255, 255, 255, 0.25);
            color: #ccc;
        }

        .tab-btn.active {
            background: #fff;
            border-color: #fff;
            color: #0a0a0a;
        }

        .tab-btn .version {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tab-btn.active .version {
            background: rgba(0, 0, 0, 0.1);
        }

        /* Mockup Info */
        .mockup-info {
            font-size: 12px;
            color: #666;
        }

        /* Branding */
        .branding {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .powered-by {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .powered-by a {
            color: #888;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .powered-by a:hover {
            color: #fff;
        }

        /* Content Area */
        .content {
            padding-top: 70px;
            height: 100vh;
        }

        .tab-panel {
            display: none;
            height: calc(100vh - 70px);
        }

        .tab-panel.active {
            display: block;
        }

        .tab-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .tab-nav {
                padding: 0 12px;
            }

            .tab-nav-inner {
                flex-direction: column;
                height: auto;
                padding: 12px 0;
                gap: 12px;
            }

            .logo {
                font-size: 12px;
            }

            .tabs {
                display: flex;
                width: 100%;
                overflow-x: auto;
                padding-bottom: 4px;
                padding-right: 20px;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                -ms-overflow-style: none;
                gap: 6px;
                justify-content: flex-start;
            }

            .tabs::-webkit-scrollbar {
                display: none;
            }

            .tab-btn {
                padding: 8px 12px;
                font-size: 10px;
                white-space: nowrap;
                flex-shrink: 0;
            }

            .tab-btn .version {
                margin-left: 6px;
                padding: 2px 6px;
                font-size: 9px;
            }

            .branding {
                display: none;
            }

            .content {
                padding-top: 100px;
            }

            .tab-panel {
                height: calc(100vh - 100px);
            }
        }

        @media (max-width: 480px) {
            .tab-nav {
                padding: 0 8px;
            }

            .tab-nav-inner {
                padding: 10px 0;
                gap: 10px;
            }

            .logo {
                font-size: 11px;
                letter-spacing: 0.05em;
            }

            .tab-btn {
                padding: 6px 10px;
                font-size: 10px;
                border-radius: 6px;
            }

            .tab-btn .version {
                display: none;
            }

            .content {
                padding-top: 90px;
            }

            .tab-panel {
                height: calc(100vh - 90px);
            }
        }
    </style>
</head>
<body>
    <!-- Tab Navigation -->
    <nav class="tab-nav">
        <div class="tab-nav-inner">
            <div class="logo"><span>Wealth Foundations Partners</span> Mockups</div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="modern">
                    Modern Blue <span class="version">V1</span>
                </button>

                <button class="tab-btn" data-tab="burgundy">
                    Burgundy Luxury <span class="version">V2</span>
                </button>

                <button class="tab-btn" data-tab="nature">
                    Nature Organic <span class="version">V3</span>
                </button>

                <button class="tab-btn" data-tab="minimal">
                    Minimal Black <span class="version">V4</span>
                </button>
            </div>

            <div class="branding">
                <div class="mockup-info">4 Designs</div>
                <div class="powered-by">
                    Powered by <a href="https://silvermineai.com" target="_blank">Silvermine AI</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content Panels -->
    <main class="content">
        <div class="tab-panel active" id="panel-modern">
            <iframe src="v1.html" title="Modern Blue - Professional dark theme with blue accents"></iframe>
        </div>

        <div class="tab-panel" id="panel-burgundy">
            <iframe src="v2.html" title="Burgundy Luxury - Warm earthy tones with premium feel"></iframe>
        </div>

        <div class="tab-panel" id="panel-nature">
            <iframe src="v3.html" title="Nature Organic - Green sage palette with natural elements"></iframe>
        </div>

        <div class="tab-panel" id="panel-minimal">
            <iframe src="v4.html" title="Minimal Black - Clean black and white with mustard accents"></iframe>
        </div>
    </main>

    <script>
        // Tab switching functionality
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabPanels = document.querySelectorAll('.tab-panel');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const targetTab = button.getAttribute('data-tab');

                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabPanels.forEach(panel => panel.classList.remove('active'));

                button.classList.add('active');
                document.getElementById(`panel-${targetTab}`).classList.add('active');
            });
        });

        // Keyboard navigation (1-4 for quick switching)
        document.addEventListener('keydown', (e) => {
            const num = parseInt(e.key);
            if (num >= 1 && num <= 4) {
                const buttons = document.querySelectorAll('.tab-btn');
                if (buttons[num - 1]) {
                    buttons[num - 1].click();
                }
            }
        });

        // Update page title based on active tab
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const tabName = button.textContent.trim().split('\n')[0].trim();
                document.title = `${tabName} - Wealth Foundations Partners | Silvermine AI`;
            });
        });
    </script>
</body>
</html>
