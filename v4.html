<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Foundations Partners</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        'mustard': '#DCAE1D'
                    }
                }
            }
        }
    </script>

    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }
        .animate-delay-1 { animation-delay: 3.0s; opacity: 0; }
        .animate-delay-2 { animation-delay: 3.8s; opacity: 0; }
        .animate-delay-3 { animation-delay: 4.4s; opacity: 0; }
        .animate-delay-4 { animation-delay: 5.0s; opacity: 0; }

        body { font-family: 'Inter', sans-serif; background-color: #ffffff; }
        h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons Components ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Menu = (props) => <IconBase {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;
        const Shield = (props) => <IconBase {...props}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></IconBase>;
        const TrendingUp = (props) => <IconBase {...props}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></IconBase>;
        const Users = (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>;
        const GraduationCap = (props) => <IconBase {...props}><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></IconBase>;
        const Calendar = (props) => <IconBase {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconBase>;
        const Briefcase = (props) => <IconBase {...props}><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></IconBase>;
        const ArrowRight = (props) => <IconBase {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconBase>;
        const Check = (props) => <IconBase {...props}><polyline points="20 6 9 17 4 12"/></IconBase>;

        // --- Data ---
        const DIFFERENTIATORS = [
          { title: "Active Tactical Management", desc: "Strategies that reposition based on market sentiment, constantly adjusting to protect wealth.", icon: <TrendingUp size={24} /> },
          { title: "Holistic Planning", desc: "Comprehensive handling of retirement, investment, tax analysis, and estate planning.", icon: <Briefcase size={24} /> },
          { title: "Experience & Expertise", desc: "Decades of combined market wisdom guiding your financial future with steady hands.", icon: <Shield size={24} /> },
          { title: "Client Education", desc: "We prioritize financial literacy so you understand the 'why' behind every move.", icon: <GraduationCap size={24} /> },
          { title: "Team Approach", desc: "A collaborative team dedicated to your specific financial milestones.", icon: <Users size={24} /> },
          { title: "Quarterly Reviews", desc: "Proactive engagement every 90 days to ensure your plan evolves with you.", icon: <Calendar size={24} /> }
        ];

        // --- Components ---
        const Navigation = () => {
          const [isOpen, setIsOpen] = useState(false);
          const [scrolled, setScrolled] = useState(false);

          useEffect(() => {
            const handleScroll = () => setScrolled(window.scrollY > 50);
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          const navLinks = [
            { name: 'Services', href: '#services' },
            { name: 'About', href: '#about' },
            { name: 'Contact', href: '#contact' }
          ];

          return (
            <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ease-in-out ${scrolled ? 'bg-white py-4 shadow-sm' : 'bg-transparent py-8'}`}>
              <div className="container mx-auto px-8 flex justify-between items-center">
                <div className={`font-serif text-2xl tracking-wide ${scrolled ? 'text-black' : 'text-white drop-shadow-md'}`}>
                  WEALTH FOUNDATIONS
                </div>

                <div className={`hidden md:flex gap-12 text-sm font-light tracking-widest uppercase ${scrolled ? 'text-black' : 'text-white drop-shadow-md'}`}>
                  {navLinks.map((link) => (
                    <a key={link.name} href={link.href} className="hover:text-yellow-600 transition-colors duration-300 relative group">
                      {link.name}
                      <span className="absolute -bottom-2 left-0 w-0 h-[1px] bg-yellow-600 group-hover:w-full transition-all duration-300"></span>
                    </a>
                  ))}
                </div>

                <button className="md:hidden text-inherit" onClick={() => setIsOpen(!isOpen)}>
                  {isOpen ? <X size={24} color={scrolled ? 'black' : 'white'} /> : <Menu size={24} color={scrolled ? 'black' : 'white'} />}
                </button>
              </div>

              {isOpen && (
                <div className="fixed inset-0 bg-white z-50 flex flex-col justify-center items-center gap-8 md:hidden">
                  <button className="absolute top-8 right-8" onClick={() => setIsOpen(false)}>
                    <X size={32} />
                  </button>
                  {navLinks.map((link) => (
                    <a key={link.name} href={link.href} onClick={() => setIsOpen(false)} className="text-black font-serif text-3xl hover:text-yellow-600 transition-colors">
                      {link.name}
                    </a>
                  ))}
                </div>
              )}
            </nav>
          );
        };

        const Hero = () => {
          return (
            <section className="relative h-screen w-full overflow-hidden flex items-center justify-center">
              <div className="absolute inset-0 w-full h-full z-0 bg-black overflow-hidden">
                <div className="absolute inset-0 z-10 bg-black/30" />
                <iframe
                  src="https://player.vimeo.com/video/1154518314?background=1&autoplay=1&loop=1&byline=0&title=0&muted=1"
                  className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 min-w-full min-h-full object-cover pointer-events-none"
                  frameBorder="0"
                  allow="autoplay; fullscreen; picture-in-picture"
                  title="Hero Video"
                  style={{ width: 'max(100%, 177.78vh)', height: 'max(100%, 56.25vw)' }}
                ></iframe>
              </div>

              <div className="relative z-20 container mx-auto px-8 text-center text-white">
                <div className="font-serif text-6xl md:text-8xl tracking-tight mb-8 leading-[1.1] drop-shadow-lg">
                  <div className="animate-fade-in-up animate-delay-1">
                    Take Control of
                  </div>
                  <div className="animate-fade-in-up animate-delay-2 italic font-light">
                    What's Next
                  </div>
                </div>

                <p className="animate-fade-in-up animate-delay-3 text-lg md:text-xl text-white/90 max-w-xl mx-auto mb-12 font-light tracking-wide drop-shadow-md">
                  Proactive wealth management designed for an evolving market.
                </p>

                <div className="animate-fade-in-up animate-delay-4 flex flex-col sm:flex-row gap-6 justify-center">
                  <a href="#contact" className="bg-white text-black px-10 py-4 font-medium tracking-widest uppercase text-sm hover:bg-gray-100 transition-colors rounded-none">
                    Get Started
                  </a>
                  <a href="#about" className="border border-white text-white px-10 py-4 font-medium tracking-widest uppercase text-sm hover:bg-white hover:text-black transition-colors rounded-none backdrop-blur-sm">
                    Learn More
                  </a>
                </div>
              </div>
            </section>
          );
        };

        const ServicesSection = () => {
          const [activeIndex, setActiveIndex] = useState(0);

          return (
            <section id="services" className="py-24 bg-gray-50">
              <div className="container mx-auto px-8">
                <div className="max-w-3xl mb-12">
                  <h2 className="font-serif text-4xl md:text-5xl text-black mb-4">The Standard of Excellence</h2>
                  <p className="text-gray-500 font-light text-lg">Detailed attention to every facet of your wealth.</p>
                </div>

                <div className="flex flex-col md:flex-row gap-12 items-start">
                  <div className="w-full md:w-1/2 space-y-2">
                    {DIFFERENTIATORS.map((item, index) => {
                      const isActive = activeIndex === index;
                      return (
                        <div
                          key={index}
                          onClick={() => setActiveIndex(index === activeIndex ? null : index)}
                          className={`cursor-pointer border-b border-gray-200 transition-all duration-300 ${isActive ? 'bg-white shadow-sm -mx-4 px-4 rounded-lg border-transparent py-6' : 'py-6'}`}
                        >
                          <div className="flex items-center justify-between group">
                            <h3 className={`font-serif text-xl transition-colors duration-300 ${isActive ? 'text-black' : 'text-gray-400 group-hover:text-black'}`}>
                              {item.title}
                            </h3>
                            <div className={`transition-transform duration-300 ${isActive ? 'rotate-180 text-yellow-600' : 'text-gray-300'}`}>
                              {isActive ? <Check size={20} /> : <ArrowRight size={16} />}
                            </div>
                          </div>

                          {isActive && (
                            <div className="overflow-hidden">
                              <div className="pt-4 text-gray-500 font-light leading-relaxed flex gap-4">
                                 <div className="text-yellow-600 shrink-0 mt-1">{item.icon}</div>
                                 <p>{item.desc}</p>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  <div className="w-full md:w-1/2 sticky top-24">
                     <img
                       src="https://i.postimg.cc/KYkNqdVF/2.png"
                       alt="Architecture"
                       className="w-full h-[600px] object-cover grayscale hover:grayscale-0 transition-all duration-700 shadow-2xl"
                     />
                  </div>
                </div>
              </div>
            </section>
          );
        };

        const AboutSection = () => {
          return (
            <section id="about" className="py-24 md:py-32 bg-white">
              <div className="container mx-auto px-8">
                <div className="max-w-3xl mx-auto text-center">
                  <h2 className="font-serif text-4xl md:text-5xl text-black mb-8 leading-tight">
                    A Team Approach to <br/>Your Legacy
                  </h2>
                  <div className="h-[1px] w-24 bg-gray-200 mb-8 mx-auto"></div>
                  <p className="text-gray-600 leading-relaxed mb-6 font-light text-lg">
                    We don't believe in the solitary advisor model. At Wealth Foundations Partners, you gain access to a collaborative team dedicated to understanding the nuances of your financial life.
                  </p>
                  <p className="text-gray-600 leading-relaxed font-light mb-10 text-lg">
                    Our mandatory quarterly reviews ensure we are proactive, not reactive. We educate, we plan, and we execute with precision, ensuring you are always in control of your financial narrative.
                  </p>
                  <a href="#services" className="inline-flex items-center gap-2 text-black border-b border-black pb-1 hover:text-yellow-600 hover:border-yellow-600 transition-all uppercase text-xs tracking-widest font-semibold">
                    Explore Our Services <ArrowRight size={14} />
                  </a>
                </div>
              </div>
            </section>
          );
        };

        const CustodiansSection = () => {
          return (
            <section className="relative py-32 bg-black text-white overflow-hidden">
              <div className="container mx-auto px-8 relative z-10">
                <div className="flex flex-col md:flex-row justify-between items-center gap-16">

                  <div className="md:w-1/2">
                    <span className="text-yellow-600 text-xs font-bold tracking-[0.2em] uppercase mb-4 block">Security</span>
                    <h2 className="font-serif text-4xl md:text-6xl mb-8 leading-none">
                      Institutional <br/> Strength.
                    </h2>
                    <p className="text-gray-400 text-lg font-light leading-relaxed max-w-md">
                      Your assets deserve the highest level of security. We partner with the world's largest brokerage firms to provide you with independent custody, institutional execution, and robust protection.
                    </p>
                  </div>

                  <div className="md:w-1/2 w-full flex flex-col gap-6">
                    <div className="group border border-white/20 p-8 hover:border-yellow-600 transition-colors duration-500 cursor-default bg-transparent">
                      <h3 className="font-serif text-3xl md:text-4xl text-white group-hover:text-yellow-600 transition-colors duration-500 text-center">
                        Charles Schwab
                      </h3>
                    </div>
                    <div className="group border border-white/20 p-8 hover:border-yellow-600 transition-colors duration-500 cursor-default bg-transparent">
                      <h3 className="font-serif text-3xl md:text-4xl text-white group-hover:text-yellow-600 transition-colors duration-500 text-center">
                        Fidelity Investments
                      </h3>
                    </div>
                  </div>

                </div>
              </div>
            </section>
          );
        };

        const CTASection = () => {
          return (
            <section id="contact" className="py-32 bg-white relative">
              <div className="container mx-auto px-8">
                <div className="grid lg:grid-cols-2 gap-0 border border-gray-100 shadow-2xl bg-white">

                  <div className="relative bg-gray-50 p-12 flex flex-col justify-center items-center">
                    <div className="relative w-full max-w-md aspect-[4/5]">
                       <img
                        src="https://i.postimg.cc/0NMfWL3P/3.png"
                        alt="Interior"
                        className="w-full h-full object-contain shadow-lg grayscale hover:grayscale-0 transition-all duration-700"
                      />
                    </div>
                    <div className="mt-8 text-center">
                      <blockquote className="text-black font-serif text-xl md:text-2xl leading-relaxed mb-4">
                        "We handle everything so you don't have to."
                      </blockquote>
                      <div className="w-8 h-1 bg-yellow-600 mx-auto"></div>
                    </div>
                  </div>

                  <div className="bg-white p-12 lg:p-20 flex flex-col justify-center">
                    <h2 className="font-serif text-4xl text-black mb-12">Begin the Conversation</h2>

                    <div className="space-y-12">
                      <div className="group">
                        <h3 className="text-lg font-bold uppercase tracking-widest mb-4 flex items-center gap-3">
                          <span className="w-2 h-2 bg-yellow-600 rounded-none"></span>
                          Introductory Meeting
                        </h3>
                        <p className="text-gray-500 font-light mb-6">
                          Explore our active tactical management strategies with no obligation.
                        </p>
                        <button className="px-8 py-4 border border-black text-black text-sm tracking-widest uppercase hover:bg-black hover:text-white transition-all duration-300 w-full sm:w-auto">
                          Schedule Now
                        </button>
                      </div>

                      <div className="w-full h-px bg-gray-100"></div>

                      <div className="group">
                        <h3 className="text-lg font-bold uppercase tracking-widest mb-4 flex items-center gap-3">
                          <span className="w-2 h-2 bg-black rounded-none"></span>
                          Comprehensive Plan
                        </h3>
                        <p className="text-gray-500 font-light mb-6">
                          Ready for a deep dive? Receive a full annual financial roadmap at no cost.
                        </p>
                        <button className="px-8 py-4 bg-black text-white text-sm tracking-widest uppercase hover:bg-yellow-600 hover:border-yellow-600 border border-black transition-all duration-300 w-full sm:w-auto">
                          Start Your Plan
                        </button>
                      </div>
                    </div>
                  </div>

                </div>
              </div>
            </section>
          );
        };

        const Footer = () => {
          return (
            <footer className="bg-white text-black py-20 border-t border-gray-100">
              <div className="container mx-auto px-8">
                <div className="flex flex-col md:flex-row justify-between items-start gap-12">
                  <div className="max-w-md">
                    <h4 className="font-serif text-2xl mb-6">WEALTH FOUNDATIONS PARTNERS</h4>
                    <p className="text-gray-500 font-light leading-relaxed text-sm">
                      Navigating complex markets with active strategies and holistic planning.
                    </p>
                  </div>

                  <div className="flex gap-16 text-sm">
                    <div className="flex flex-col gap-4">
                      <span className="font-bold uppercase tracking-widest text-xs mb-2">Menu</span>
                      <a href="#about" className="text-gray-600 hover:text-black transition-colors">About</a>
                      <a href="#services" className="text-gray-600 hover:text-black transition-colors">Services</a>
                      <a href="#contact" className="text-gray-600 hover:text-black transition-colors">Contact</a>
                    </div>
                    <div className="flex flex-col gap-4">
                      <span className="font-bold uppercase tracking-widest text-xs mb-2">Legal</span>
                      <a href="#" className="text-gray-600 hover:text-black transition-colors">Privacy</a>
                      <a href="#" className="text-gray-600 hover:text-black transition-colors">Disclosures</a>
                    </div>
                  </div>
                </div>

                <div className="mt-20 pt-8 border-t border-gray-100 flex flex-col md:flex-row justify-between items-center text-xs text-gray-400 uppercase tracking-wider">
                  <p>&copy; {new Date().getFullYear()} Wealth Foundations Partners.</p>
                  <div className="flex gap-6 mt-4 md:mt-0">
                     <span>LinkedIn</span>
                     <span>Facebook</span>
                  </div>
                </div>
              </div>
            </footer>
          );
        };

        const App = () => {
          return (
            <div className="bg-white min-h-screen font-sans text-black selection:bg-gray-200 selection:text-black">
              <Navigation />
              <Hero />
              <ServicesSection />
              <AboutSection />
              <CustodiansSection />
              <CTASection />
              <Footer />
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
