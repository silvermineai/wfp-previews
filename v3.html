<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Foundations Partners</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Vimeo Player API -->
    <script src="https://player.vimeo.com/api/player.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        'dark-green': '#1A3C34',
                        'sage-green': '#8DA399',
                        'light-sage': '#D1E0D6',
                        'cream': '#F7F5F0',
                        'deep-cream': '#EBE8DE',
                        'moss': '#4E6E5D'
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        body {
            /* Fix for potential white lines in dark mode browsers */
            background-color: #F7F5F0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons Components (Replaces lucide-react imports) ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Menu = (props) => <IconBase {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 18 18"/></IconBase>;
        const Shield = (props) => <IconBase {...props}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></IconBase>;
        const TrendingUp = (props) => <IconBase {...props}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></IconBase>;
        const Users = (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>;
        const BookOpen = (props) => <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>;
        const Clock = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>;
        const Activity = (props) => <IconBase {...props}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></IconBase>;
        const Award = (props) => <IconBase {...props}><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></IconBase>;
        const Briefcase = (props) => <IconBase {...props}><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></IconBase>;
        const ArrowRight = (props) => <IconBase {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconBase>;

        // --- Main Application ---
        const App = () => {
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [scrolled, setScrolled] = useState(false);
          const [videoEnded, setVideoEnded] = useState(false);
          const videoRef = React.useRef(null);

          useEffect(() => {
            const handleScroll = () => {
              setScrolled(window.scrollY > 50);
            };
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          useEffect(() => {
            // Fallback timer in case Vimeo API doesn't load (e.g., in Markup editor)
            const fallbackTimer = setTimeout(() => {
              setVideoEnded(true);
            }, 12000); // 12 seconds fallback

            try {
              if (videoRef.current && typeof Vimeo !== 'undefined') {
                const player = new Vimeo.Player(videoRef.current);
                let duration = 0;

                player.getDuration().then(d => {
                  duration = d;
                });

                player.on('timeupdate', (data) => {
                  if (duration > 0 && data.seconds >= duration - 0.5) {
                    clearTimeout(fallbackTimer);
                    setVideoEnded(true);
                  }
                });
              }
            } catch (e) {
              // Vimeo API not available, fallback timer will handle it
            }

            return () => clearTimeout(fallbackTimer);
          }, []);

          const scrollToSection = (id) => {
            const element = document.getElementById(id);
            if (element) {
              element.scrollIntoView({ behavior: 'smooth' });
              setIsMenuOpen(false);
            }
          };

          // Decorative Contour Lines Component
          const ContourLines = ({ className, opacity = 0.1 }) => (
            <svg className={`absolute pointer-events-none ${className}`} width="100%" height="100%" viewBox="0 0 1440 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
              <path d="M-100 600 C 200 400, 600 800, 1540 500" stroke="#8DA399" strokeWidth="1.5" fill="none" opacity={opacity} />
              <path d="M-100 650 C 250 450, 650 850, 1540 550" stroke="#8DA399" strokeWidth="1" fill="none" opacity={opacity * 0.7} />
              <path d="M-100 700 C 300 500, 700 900, 1540 600" stroke="#8DA399" strokeWidth="0.5" fill="none" opacity={opacity * 0.5} />
            </svg>
          );

          return (
            <div className="font-sans text-dark-green bg-cream overflow-x-hidden w-full selection:bg-moss selection:text-white">
              {/* Navigation */}
              <nav
                className={`fixed w-full z-50 transition-all duration-500 ease-in-out ${
                  scrolled ? 'bg-dark-green text-cream py-4 shadow-xl' : 'bg-transparent text-white py-8'
                }`}
              >
                <div className="container mx-auto px-6 flex justify-between items-center">
                  <div className="text-2xl font-serif font-bold tracking-wider uppercase z-50 relative drop-shadow-md">
                    Wealth Foundations Partners
                  </div>

                  {/* Desktop Menu */}
                  <div className="hidden md:flex items-center space-x-12">
                    <button onClick={() => scrollToSection('services')} className="hover:text-sage-green transition-colors text-sm uppercase tracking-widest font-medium relative group drop-shadow-md">
                      Services
                      <span className="absolute -bottom-2 left-0 w-0 h-0.5 bg-sage-green transition-all group-hover:w-full"></span>
                    </button>
                    <button onClick={() => scrollToSection('about')} className="hover:text-sage-green transition-colors text-sm uppercase tracking-widest font-medium relative group drop-shadow-md">
                      About
                      <span className="absolute -bottom-2 left-0 w-0 h-0.5 bg-sage-green transition-all group-hover:w-full"></span>
                    </button>
                    <button
                      onClick={() => scrollToSection('contact')}
                      className={`px-8 py-3 transition-all duration-300 text-sm font-bold uppercase tracking-widest border border-sage-green shadow-lg ${
                        scrolled
                          ? 'bg-sage-green text-dark-green hover:bg-white hover:border-white'
                          : 'bg-transparent hover:bg-sage-green hover:text-dark-green backdrop-blur-sm'
                      }`}
                    >
                      Get Started
                    </button>
                  </div>

                  {/* Mobile Menu Button */}
                  <button
                    className="md:hidden z-50 relative"
                    onClick={() => setIsMenuOpen(!isMenuOpen)}
                  >
                    {isMenuOpen ? <X size={28} /> : <Menu size={28} />}
                  </button>
                </div>

                {/* Mobile Menu */}
                <div className={`fixed inset-0 bg-dark-green text-cream z-40 flex flex-col items-center justify-center space-y-8 transition-transform duration-500 ${isMenuOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                  <ContourLines className="opacity-10" />
                  <button onClick={() => scrollToSection('services')} className="text-3xl font-serif hover:text-sage-green">Services</button>
                  <button onClick={() => scrollToSection('about')} className="text-3xl font-serif hover:text-sage-green">About</button>
                  <button onClick={() => scrollToSection('contact')} className="text-3xl font-serif hover:text-sage-green">Get Started</button>
                </div>
              </nav>

              {/* Hero Section with Video Background */}
              <header className="relative h-screen w-full flex items-center justify-center overflow-hidden">
                {/* Video Background Container */}
                <div className="absolute inset-0 w-full h-full overflow-hidden z-0 bg-cream">
                  {/* Fallback image that fades in when video ends */}
                  <img
                    src="images/headers/hero-fallback.png"
                    alt="Wealth Foundations"
                    className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ${videoEnded ? 'opacity-100' : 'opacity-0'}`}
                    style={{ zIndex: 5 }}
                  />
                  <iframe
                    ref={videoRef}
                    src="https://player.vimeo.com/video/1154518314?background=1&autoplay=1&loop=0&byline=0&title=0&muted=1"
                    className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 min-w-full min-h-full object-cover pointer-events-none transition-opacity duration-1000 ${videoEnded ? 'opacity-0' : 'opacity-100'}`}
                    style={{ width: 'max(100%, 177.78vh)', height: 'max(100%, 56.25vw)' }}
                    allow="autoplay; fullscreen; picture-in-picture"
                    title="Hero Video"
                  ></iframe>

                  {/* White/Off-White Gradient Overlay - Subtle fade to section below */}
                  <div className="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-cream/80 mix-blend-normal" style={{ zIndex: 6 }}></div>
                </div>

                {/* Hero Content */}
                <div className="relative z-10 container mx-auto px-6 text-center mt-20">
                  <h1 className="text-5xl md:text-7xl lg:text-8xl font-serif text-white mb-8 leading-[1.1] animate-fade-in-up drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)]">
                    The Life You Want <br />
                    <span className="italic font-light text-white">Starts with a Plan</span>
                  </h1>
                  <p className="text-xl md:text-2xl text-white max-w-2xl mx-auto mb-12 font-light leading-relaxed drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
                    Experience active tactical management and comprehensive holistic planning designed to secure your legacy.
                  </p>
                  <div className="flex flex-col sm:flex-row justify-center gap-6">
                    <button
                      onClick={() => scrollToSection('contact')}
                      className="group relative bg-sage-green text-dark-green px-12 py-5 text-sm font-bold uppercase tracking-widest overflow-hidden transition-all hover:bg-cream shadow-xl"
                    >
                      <span className="relative z-10">Start Your Plan</span>
                      <div className="absolute inset-0 bg-cream transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300 ease-out"></div>
                    </button>
                  </div>
                </div>

                {/* Decorative Arch Bottom */}
                <div className="absolute bottom-0 left-0 w-full h-12 bg-cream rounded-t-[50%] scale-x-150 translate-y-1/2 z-20"></div>
              </header>

              {/* Differentiators Section */}
              <section id="differentiators" className="py-16 bg-cream relative overflow-hidden">
                <ContourLines className="top-0 left-0" opacity={0.3} />

                <div className="container mx-auto px-6 relative z-10">
                  <div className="text-center mb-12">
                    <span className="text-moss uppercase tracking-[0.2em] text-sm font-bold mb-4 block">Wealth Foundations Partners have higher standards</span>
                    <h2 className="text-4xl md:text-5xl font-serif text-dark-green">Six Cornerstones You Won't Find Anywhere Else</h2>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {[
                      {
                        icon: <Activity size={32} />,
                        title: "Active Tactical Management",
                        desc: "We don't just set it and forget it. Our strategies reposition based on market sentiment, constantly adjusting to seize opportunity and manage risk."
                      },
                      {
                        icon: <TrendingUp size={32} />,
                        title: "Comprehensive Holistic Planning",
                        desc: "From retirement and investment analysis to tax and estate planning, we handle every aspect of your financial life."
                      },
                      {
                        icon: <Award size={32} />,
                        title: "Decades of Experience",
                        desc: "Leverage the wisdom of seasoned professionals who have successfully guided wealth through every type of market cycle."
                      },
                      {
                        icon: <BookOpen size={32} />,
                        title: "Client Education",
                        desc: "We prioritize your financial literacy. We believe an educated client is an empowered client, capable of making confident decisions."
                      },
                      {
                        icon: <Users size={32} />,
                        title: "Team Approach",
                        desc: "You don't just get an advisor; you get a collaborative team dedicated to reviewing your plan from multiple perspectives."
                      },
                      {
                        icon: <Clock size={32} />,
                        title: "Proactive Engagement",
                        desc: "With mandatory quarterly reviews, we stay ahead of life's changes, ensuring your plan evolves as fast as your life does."
                      }
                    ].map((item, index) => (
                      <div key={index} className="group relative bg-white p-8 shadow-sm hover:shadow-xl transition-all duration-500 hover:-translate-y-2 border-t-4 border-transparent hover:border-sage-green overflow-hidden rounded-sm">
                        <div className="absolute top-0 right-0 w-24 h-24 bg-cream rounded-bl-full transform translate-x-full -translate-y-full group-hover:translate-x-0 group-hover:translate-y-0 transition-transform duration-500"></div>

                        <div className="relative z-10">
                          <div className="text-sage-green mb-6 group-hover:text-dark-green transition-colors duration-300">
                            {item.icon}
                          </div>
                          <h3 className="text-xl font-serif font-bold text-dark-green mb-4 group-hover:text-moss transition-colors">{item.title}</h3>
                          <p className="text-dark-green/70 leading-relaxed text-sm">{item.desc}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              {/* Value Proposition / Custodians */}
              <section id="about" className="py-16 bg-dark-green text-cream relative overflow-hidden">
                <div className="absolute top-0 right-0 w-[800px] h-[800px] border border-sage-green/10 rounded-full translate-x-1/2 -translate-y-1/2"></div>
                <div className="absolute top-0 right-0 w-[600px] h-[600px] border border-sage-green/10 rounded-full translate-x-1/2 -translate-y-1/2"></div>

                <div className="container mx-auto px-6 relative z-10">
                  <div className="flex flex-col lg:flex-row items-center">
                    {/* Left Content */}
                    <div className="lg:w-1/2 lg:pr-16 mb-8 lg:mb-0">
                      <span className="text-sage-green uppercase tracking-[0.2em] text-sm font-bold mb-4 block">Security & Performance</span>
                      <h2 className="text-4xl md:text-6xl font-serif mb-6 leading-none">
                        World-Class <br/>
                        <span className="italic text-sage-green">Custodians.</span>
                      </h2>
                      <p className="text-light-sage text-lg leading-relaxed mb-8 font-light">
                        Transparency and security are the bedrock of our practice. We partner with the industry's most trusted institutions, ensuring your assets are held by two of the largest brokerage firms in the world.
                      </p>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-10">
                        <div className="flex items-center space-x-4 p-4 border border-sage-green/30 rounded-lg bg-cream/5 backdrop-blur-sm">
                          <Shield className="text-sage-green" size={28} />
                          <span className="text-xl font-serif tracking-wide">Charles Schwab</span>
                        </div>
                        <div className="flex items-center space-x-4 p-4 border border-sage-green/30 rounded-lg bg-cream/5 backdrop-blur-sm">
                          <Shield className="text-sage-green" size={28} />
                          <span className="text-xl font-serif tracking-wide">Fidelity</span>
                        </div>
                      </div>

                      {/* Risk-Based Performance */}
                      <div>
                        <h4 className="font-bold text-sage-green mb-2 uppercase tracking-wide text-sm">Risk-Based Performance</h4>
                        <p className="text-light-sage text-sm leading-relaxed">
                          We run sophisticated risk-based performance analytics for our approach, ensuring your portfolio aligns perfectly with your tolerance and timeline.
                        </p>
                      </div>
                    </div>

                    {/* Right Visual */}
                    <div className="lg:w-1/2 relative mt-8 lg:mt-0">
                       <div className="relative z-10 rounded-t-full rounded-b-lg overflow-hidden h-[450px]">
                          <img src="https://i.postimg.cc/YChqvHjY/Untitledesign.png" alt="Secure & Protected" className="w-full h-full object-cover" />
                       </div>

                       {/* Decorative floating elements */}
                       <div className="absolute -top-4 -right-4 w-full h-full rounded-t-full rounded-b-lg border-2 border-sage-green z-0 hidden md:block"></div>
                    </div>
                  </div>
                </div>
              </section>

              {/* Annual Plan Section */}
              <section id="services" className="py-16 bg-deep-cream relative">
                 <div className="absolute top-0 left-0 w-full h-16 bg-dark-green rounded-b-[50%] scale-x-150 -translate-y-1/2 z-20"></div>

                <div className="container mx-auto px-6 relative z-10">
                  <div className="max-w-4xl mx-auto text-center">
                    <h2 className="text-4xl md:text-5xl font-serif text-dark-green mb-8">Free Annual Financial Plans</h2>
                    <p className="text-xl text-dark-green/80 leading-relaxed font-light">
                      We don't just manage money; we build blueprints for your future. Whether you are just starting or preserving a legacy, we provide a comprehensive financial plan annually—at no cost to you.
                    </p>
                  </div>
                </div>
              </section>

              {/* CTA Section */}
              <section id="contact" className="py-16 bg-white relative">
                <ContourLines className="bottom-0 right-0 rotate-180" opacity={0.15} />

                <div className="container mx-auto px-6 relative z-10">
                  <div className="text-center mb-12">
                    <h2 className="text-4xl md:text-6xl font-serif text-dark-green mb-6">Take the Next Step</h2>
                    <p className="text-dark-green/70 text-lg font-light tracking-wide">Choose the path that fits your current needs.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-10 max-w-6xl mx-auto">

                    {/* Light Commitment */}
                    <div className="group bg-cream p-10 text-center transition-all duration-300 hover:shadow-2xl relative overflow-hidden rounded-tl-3xl rounded-br-3xl">
                      <div className="absolute inset-0 border border-transparent group-hover:border-sage-green/50 transition-colors rounded-tl-3xl rounded-br-3xl pointer-events-none"></div>

                      <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-6 text-moss shadow-sm">
                        <Briefcase size={28} />
                      </div>
                      <h3 className="text-3xl font-serif text-dark-green mb-4">Introduction Meeting</h3>
                      <p className="text-dark-green/70 mb-8 leading-relaxed text-sm h-12">
                        Schedule a no-obligation meeting. Let us introduce you to our active tactical management strategies.
                      </p>
                      <button className="flex items-center justify-center space-x-2 w-full bg-white border border-sage-green text-dark-green py-4 font-bold uppercase tracking-widest hover:bg-sage-green hover:text-white transition-all duration-300 text-xs">
                        <span>Schedule a Meeting</span>
                        <ArrowRight size={16} />
                      </button>
                    </div>

                    {/* Heavy Commitment */}
                    <div className="group bg-dark-green p-10 text-center text-cream shadow-xl relative overflow-hidden rounded-tr-3xl rounded-bl-3xl transform md:scale-105 z-10">
                       <ContourLines className="opacity-10 absolute inset-0" />
                       <div className="absolute top-0 right-0 w-32 h-32 bg-sage-green rounded-bl-full opacity-10"></div>

                      <div className="w-16 h-16 bg-sage-green/20 rounded-full flex items-center justify-center mx-auto mb-6 text-sage-green border border-sage-green/30">
                        <TrendingUp size={28} />
                      </div>
                      <h3 className="text-3xl font-serif text-white mb-4">Free Financial Plan</h3>
                      <p className="text-light-sage mb-8 leading-relaxed text-sm h-12">
                        Ready to dive deeper? Share your data securely, and we will construct a comprehensive, personalized plan.
                      </p>
                      <button className="flex items-center justify-center space-x-2 w-full bg-sage-green text-dark-green py-4 font-bold uppercase tracking-widest hover:bg-white transition-all duration-300 text-xs shadow-lg shadow-sage-green/20">
                        <span>Obtain Free Plan</span>
                        <ArrowRight size={16} />
                      </button>
                    </div>

                  </div>
                </div>
              </section>

              {/* Footer */}
              <footer className="bg-[#11241F] text-light-sage py-12 relative overflow-hidden">
                <ContourLines className="top-0 left-0" opacity={0.05} />

                <div className="container mx-auto px-6 relative z-10">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-12">
                    <div className="max-w-md">
                      <div className="text-3xl font-serif font-bold text-cream tracking-wider uppercase mb-4">
                        Wealth Foundations <span className="text-sage-green">Partners</span>
                      </div>
                      <p className="text-sm opacity-60 leading-relaxed">
                        Empowering your financial future through active management and holistic planning.
                      </p>
                    </div>
                    <div className="flex flex-col sm:flex-row gap-8 mt-8 md:mt-0 font-serif">
                      <a href="#" className="hover:text-sage-green transition-colors text-lg">LinkedIn</a>
                      <a href="#" className="hover:text-sage-green transition-colors text-lg">Contact</a>
                      <a href="#" className="hover:text-sage-green transition-colors text-lg">Client Login</a>
                    </div>
                  </div>

                  <div className="border-t border-sage-green/20 pt-8 flex flex-col md:flex-row justify-between text-xs opacity-50 leading-relaxed">
                    <div className="mb-4 md:mb-0 max-w-xl">
                      <p className="mb-2">© {new Date().getFullYear()} Wealth Foundations Partners. All rights reserved.</p>
                      <p>
                        Investment Advisory Services offered through Wealth Foundations Partners.
                        Custodial services provided by Charles Schwab & Co., Inc. and Fidelity Investments.
                      </p>
                    </div>
                    <div className="flex flex-wrap gap-6">
                      <a href="#" className="hover:text-white transition-colors">Privacy Policy</a>
                      <a href="#" className="hover:text-white transition-colors">Terms of Use</a>
                      <a href="#" className="hover:text-white transition-colors">ADV Part 2A</a>
                    </div>
                  </div>
                </div>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
