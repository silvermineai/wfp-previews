<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Foundations Partners</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', serif; }

        /* Custom scrollbar for Webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F2F2EB;
        }
        ::-webkit-scrollbar-thumb {
            background: #9CABB4;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #72383D;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icon Components (Lucide SVGs) ---
        const Shield = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
        );
        const TrendingUp = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        );
        const Users = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        );
        const BookOpen = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        );
        const Calendar = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        );
        const FileText = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
        );
        const Award = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
        );
        const ArrowRight = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        );
        const Menu = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        );
        const X = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        );
        const CheckCircle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        );
        const Building2 = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>
        );

        // --- Main App Component ---
        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [videoEnded, setVideoEnded] = useState(false);
            const videoRef = React.useRef(null);

            useEffect(() => {
                const handleScroll = () => {
                setIsScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                if (videoRef.current) {
                    videoRef.current.addEventListener('ended', () => {
                        setVideoEnded(true);
                    });
                }
            }, []);

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                element.scrollIntoView({ behavior: 'smooth' });
                setMobileMenuOpen(false);
                }
            };

            const navLinks = [
                { name: 'Services', id: 'services' },
                { name: 'About', id: 'differentiators' },
                { name: 'Contact', id: 'contact' },
            ];

            const differentiators = [
                {
                title: "Active Tactical Management",
                desc: "Our strategies reposition based on market sentiment, constantly adjusting to real-time conditions to protect and grow your wealth.",
                icon: <TrendingUp className="w-8 h-8 text-[#72383D]" />
                },
                {
                title: "Comprehensive Holistic Planning",
                desc: "We handle everything from retirement and investment strategies to tax analysis and estate planning for a unified financial picture.",
                icon: <Shield className="w-8 h-8 text-[#72383D]" />
                },
                {
                title: "Client Education",
                desc: "We prioritize your financial literacy, empowering you with the knowledge to understand your wealth journey.",
                icon: <BookOpen className="w-8 h-8 text-[#72383D]" />
                },
                {
                title: "Collaborative Team Approach",
                desc: "You don't just get an advisor; you get an entire team collaborating to ensure every angle of your financial life is covered.",
                icon: <Users className="w-8 h-8 text-[#72383D]" />
                },
                {
                title: "Mandatory Quarterly Reviews",
                desc: "We are proactive, not reactive. Scheduled reviews ensure we stay aligned with your life changes and market shifts.",
                icon: <Calendar className="w-8 h-8 text-[#72383D]" />
                },
                {
                title: "Experience & Expertise",
                desc: "Decades of combined experience navigating complex market cycles to provide steady, reliable guidance.",
                icon: <Award className="w-8 h-8 text-[#72383D]" />
                }
            ];

            return (
                <div className="font-sans text-[#401B1B] bg-[#F2F2EB] selection:bg-[#D2DCE6] selection:text-[#401B1B]">

                {/* Navigation - Clean, solid bar style for luxury feel */}
                <nav
                    className={`fixed w-full z-50 transition-all duration-500 border-b border-[#9CABB4]/20 ${
                    isScrolled ? 'bg-[#F2F2EB]/95 backdrop-blur-md py-4' : 'bg-[#401B1B] py-5 border-none'
                    }`}
                >
                    <div className="max-w-[1400px] mx-auto px-8 flex justify-between items-center">
                    <div className={`text-2xl font-serif font-bold tracking-tight transition-colors ${isScrolled ? 'text-[#401B1B]' : 'text-[#F2F2EB]'}`}>
                        WEALTH FOUNDATIONS <span className={`${isScrolled ? 'text-[#72383D]' : 'text-[#9CABB4]'}`}>PARTNERS</span>
                    </div>

                    {/* Desktop Nav */}
                    <div className="hidden md:flex space-x-10 items-center">
                        {navLinks.map((link) => (
                        <button
                            key={link.name}
                            onClick={() => scrollToSection(link.id)}
                            className={`text-xs font-semibold uppercase tracking-widest transition-colors hover:text-[#72383D] ${
                            isScrolled ? 'text-[#401B1B]' : 'text-[#D2DCE6]'
                            }`}
                        >
                            {link.name}
                        </button>
                        ))}
                        <button
                        onClick={() => scrollToSection('contact')}
                        className={`px-8 py-3 text-xs font-bold uppercase tracking-widest transition-all border ${
                            isScrolled
                            ? 'border-[#72383D] text-[#72383D] hover:bg-[#72383D] hover:text-[#F2F2EB]'
                            : 'border-[#F2F2EB] text-[#F2F2EB] hover:bg-[#F2F2EB] hover:text-[#401B1B]'
                        }`}
                        >
                        Get Started
                        </button>
                    </div>

                    {/* Mobile Menu Button */}
                    <div className="md:hidden">
                        <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                        {mobileMenuOpen ? (
                            <X className={`w-8 h-8 ${isScrolled ? 'text-[#401B1B]' : 'text-[#F2F2EB]'}`} />
                        ) : (
                            <Menu className={`w-8 h-8 ${isScrolled ? 'text-[#401B1B]' : 'text-[#F2F2EB]'}`} />
                        )}
                        </button>
                    </div>
                    </div>

                    {/* Mobile Nav Overlay */}
                    {mobileMenuOpen && (
                    <div className="absolute top-full left-0 w-full bg-[#F2F2EB] border-b border-[#9CABB4] py-8 px-6 flex flex-col space-y-6 md:hidden">
                        {navLinks.map((link) => (
                        <button
                            key={link.name}
                            onClick={() => scrollToSection(link.id)}
                            className="text-lg font-serif font-medium text-[#401B1B] text-left border-b border-[#D2DCE6] pb-2"
                        >
                            {link.name}
                        </button>
                        ))}
                        <button
                        onClick={() => scrollToSection('contact')}
                        className="w-full py-4 bg-[#72383D] text-[#F2F2EB] font-bold uppercase tracking-widest text-sm"
                        >
                        Get Started
                        </button>
                    </div>
                    )}
                </nav>

                {/* Hero Section */}
                <header className="relative h-screen min-h-[700px] flex items-center justify-center overflow-hidden">
                    {/* Video Background */}
                    <div className="absolute inset-0 z-0 bg-[#401B1B]">
                    {/* Fallback image that fades in when video ends */}
                    <img
                        src="images/headers/hero-fallback.png"
                        alt="Wealth Foundations"
                        className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ${videoEnded ? 'opacity-70' : 'opacity-0'}`}
                        style={{ zIndex: 5 }}
                    />
                    <video
                        ref={videoRef}
                        src="videos/MWF Header.mp4"
                        className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 min-w-full min-h-full object-cover pointer-events-none grayscale-[30%] transition-opacity duration-1000 ${videoEnded ? 'opacity-0' : 'opacity-70'}`}
                        style={{ width: 'max(100%, 177.78vh)', height: 'max(100%, 56.25vw)' }}
                        autoPlay
                        muted
                        playsInline
                    />
                    {/* Overlay - Dark Luxury Gradient */}
                    <div className="absolute inset-0 bg-gradient-to-b from-[#401B1B]/60 via-[#401B1B]/40 to-[#401B1B]/90" style={{ zIndex: 6 }}></div>
                    </div>

                    <div className="relative z-10 max-w-6xl mx-auto px-8 text-center mt-20">
                    <h1 className="font-serif text-4xl md:text-5xl lg:text-6xl text-[#F2F2EB] font-medium leading-tight mb-8 tracking-tight drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)]">
                        Make Your Next Chapter <br/>
                        <span className="italic font-light text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)]">Your Best One</span>
                    </h1>
                    <p className="text-lg md:text-xl text-[#9CABB4] max-w-2xl mx-auto mb-14 font-light tracking-wide leading-relaxed">
                        Precision wealth management that adapts to the market, safeguards your legacy, and empowers your future.
                    </p>
                    <div className="flex flex-col sm:flex-row gap-6 justify-center">
                        <button
                        onClick={() => scrollToSection('contact')}
                        className="px-10 py-4 bg-[#72383D] text-[#F2F2EB] font-bold uppercase tracking-widest text-xs hover:bg-[#8A4A4F] transition-colors"
                        >
                        Schedule a Meeting
                        </button>
                    </div>
                    </div>
                </header>

                {/* Key Differentiators Section - Grid Layout (UBS Style) */}
                <section id="differentiators" className="bg-[#F2F2EB] py-32">
                    <div className="max-w-[1400px] mx-auto px-8">
                    <div className="flex flex-col md:flex-row justify-between items-end mb-20 border-b border-[#9CABB4] pb-8">
                        <div className="max-w-2xl">
                        <h2 className="text-[#72383D] font-bold uppercase tracking-widest text-xs mb-4">Wealth Foundations Partners have higher standards</h2>
                        <h3 className="font-serif text-4xl md:text-5xl text-[#401B1B] font-medium leading-tight">Six Cornerstones You Won't Find Anywhere Else</h3>
                        </div>
                        <p className="hidden md:block text-[#9CABB4] max-w-md text-sm leading-relaxed text-right pb-2">
                        A disciplined approach to wealth that prioritizes clarity, tactical action, and continuous alignment.
                        </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 border-t border-l border-[#9CABB4]">
                        {differentiators.map((item, idx) => (
                        <div key={idx} className="group p-10 border-r border-b border-[#9CABB4] bg-[#F2F2EB] hover:bg-white transition-colors duration-500 flex flex-col h-full">
                            <div className="mb-8 flex justify-between items-start">
                            <div className="p-0">
                                {item.icon}
                            </div>
                            <span className="text-[#9CABB4] font-serif italic text-lg opacity-50">0{idx + 1}</span>
                            </div>
                            <h4 className="font-serif text-2xl font-medium text-[#401B1B] mb-4">{item.title}</h4>
                            <p className="text-[#401B1B]/70 leading-relaxed text-sm font-light mt-auto">{item.desc}</p>
                        </div>
                        ))}
                    </div>

                    {/* Highlighted Extra: Free Annual Financial Plans */}
                    <div className="mt-20 border border-[#9CABB4] bg-white p-0 flex flex-col md:flex-row">
                        <div className="p-12 md:w-2/3 border-b md:border-b-0 md:border-r border-[#9CABB4]">
                        <div className="flex items-center gap-3 mb-6">
                            <FileText className="text-[#72383D] w-5 h-5" />
                            <span className="text-[#72383D] font-bold uppercase text-xs tracking-widest">Included For Every Client</span>
                        </div>
                        <h4 className="font-serif text-3xl text-[#401B1B] font-medium mb-6">Free Annual Financial Plans</h4>
                        <p className="text-[#401B1B]/70 max-w-2xl leading-relaxed font-light mb-8">
                            We believe in continuous alignment. That's why we provide comprehensive financial plans annually at no extra cost—ensuring your strategy evolves as your life does.
                        </p>
                        <button onClick={() => scrollToSection('contact')} className="px-8 py-3 bg-[#401B1B] text-[#F2F2EB] hover:bg-[#72383D] transition-colors font-bold uppercase text-xs tracking-widest">
                            Claim Your Plan
                        </button>
                        </div>
                        <div className="md:w-1/3 bg-[#D2DCE6]/30 flex flex-col justify-center items-center p-12 text-center">
                        <img src="https://i.postimg.cc/0NMfWL3P/3.png" alt="Financial Planning" className="w-full max-w-[200px] h-auto mb-6 rounded" />
                        <p className="font-serif text-[#401B1B] text-lg italic">"Planning is not a one-time event."</p>
                        </div>
                    </div>
                    </div>
                </section>

                {/* Custodians / Trust Section - Clean & Minimal */}
                <section id="custodians" className="py-24 bg-[#D2DCE6]">
                    <div className="max-w-6xl mx-auto px-8 text-center">
                    <h2 className="font-serif text-3xl md:text-4xl text-[#401B1B] font-medium mb-8">Global Strength & Security</h2>
                    <p className="max-w-3xl mx-auto text-[#401B1B]/70 mb-16 text-lg font-light leading-relaxed">
                        We partner with the industry's largest custodians to ensure your assets are held with the highest standards of safety and accessibility.
                    </p>

                    <div className="flex flex-col md:flex-row justify-center items-center gap-16 md:gap-32">
                        {/* Schwab */}
                        <div className="flex flex-col items-center group">
                            <Building2 className="w-12 h-12 text-[#401B1B] mb-4 opacity-80 group-hover:opacity-100 transition-opacity" />
                            <span className="text-3xl font-serif font-bold text-[#401B1B] tracking-tight">Charles Schwab</span>
                            <div className="h-px w-12 bg-[#72383D] mt-4 mb-2"></div>
                            <span className="text-xs uppercase tracking-widest text-[#9CABB4]">Custodian</span>
                        </div>

                        {/* Fidelity */}
                        <div className="flex flex-col items-center group">
                            <Building2 className="w-12 h-12 text-[#401B1B] mb-4 opacity-80 group-hover:opacity-100 transition-opacity" />
                            <span className="text-3xl font-serif font-bold text-[#401B1B] tracking-tight">Fidelity</span>
                            <div className="h-px w-12 bg-[#72383D] mt-4 mb-2"></div>
                            <span className="text-xs uppercase tracking-widest text-[#9CABB4]">Custodian</span>
                        </div>
                    </div>
                    </div>
                </section>

                {/* Services / Risk Based - Centered Layout */}
                <section id="services" className="bg-white">
                    <div className="max-w-5xl mx-auto px-8 py-24 md:py-32">

                    {/* Centered Text Content */}
                    <div className="flex flex-col items-center text-center">
                        <div className="inline-block px-3 py-1 border border-[#9CABB4] rounded-full mb-8 w-fit">
                        <span className="text-[#72383D] text-xs font-bold uppercase tracking-widest">Our Strategy</span>
                        </div>
                        <h2 className="font-serif text-4xl md:text-5xl text-[#401B1B] font-medium mb-8 leading-tight">
                        Risk-Based Performance <br/>&amp; Tactical Agility
                        </h2>
                        <p className="text-lg text-[#401B1B]/70 mb-12 font-light leading-relaxed max-w-3xl">
                        The "buy and hold" strategy is a relic. We employ active tactical management that respects market sentiment, making constant adjustments to protect your downside while capturing growth.
                        </p>
                        <ul className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full text-left max-w-4xl">
                        {[
                            "Strategies that reposition based on market volatility",
                            "Holistic tax and estate integration",
                            "Transparent, risk-based performance metrics"
                        ].map((item, i) => (
                            <li key={i} className="flex flex-col items-center text-center gap-4 p-6 bg-[#F2F2EB] rounded-sm">
                            <CheckCircle className="w-8 h-8 text-[#72383D]" />
                            <span className="text-[#401B1B] font-medium">{item}</span>
                            </li>
                        ))}
                        </ul>
                        <button onClick={() => scrollToSection('contact')} className="mt-16 group flex items-center gap-3 text-[#72383D] font-bold uppercase tracking-widest text-xs border-b border-[#72383D] pb-1 hover:text-[#401B1B] hover:border-[#401B1B] transition-colors">
                        Learn How It Works <ArrowRight className="w-4 h-4 group-hover:translate-x-1 transition-transform" />
                        </button>
                    </div>

                    </div>
                </section>

                {/* Contact Section - "The Choice" */}
                <section id="contact" className="py-32 bg-[#F2F2EB] border-t border-[#9CABB4]">
                    <div className="max-w-6xl mx-auto px-8">
                    <div className="text-center mb-20">
                        <h2 className="font-serif text-5xl md:text-6xl text-[#401B1B] font-medium mb-6">Start Your Journey</h2>
                        <p className="text-[#401B1B]/60 max-w-2xl mx-auto text-lg font-light">Choose the path that best fits your current needs.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-0 md:divide-x divide-[#9CABB4] border border-[#9CABB4]">

                        {/* Light Commitment - Education Focused */}
                        <div className="bg-white p-12 md:p-16 flex flex-col items-center text-center hover:bg-[#F2F2EB] transition-colors duration-500">
                        <Users className="w-12 h-12 text-[#9CABB4] mb-8" />
                        <h3 className="text-2xl font-serif text-[#401B1B] font-medium mb-4">Introductory Meeting</h3>
                        <p className="text-[#401B1B]/60 text-sm mb-10 flex-grow leading-relaxed max-w-xs font-light">
                            A casual conversation to introduce you to active tactical management. We'll educate you on our process with zero obligation.
                        </p>
                        <button className="px-10 py-4 bg-transparent border border-[#401B1B] text-[#401B1B] hover:bg-[#401B1B] hover:text-[#F2F2EB] font-bold uppercase tracking-widest text-xs transition-all">
                            Schedule Now
                        </button>
                        </div>

                        {/* Heavy Commitment - Action Focused */}
                        <div className="bg-[#401B1B] p-12 md:p-16 flex flex-col items-center text-center relative overflow-hidden">
                        {/* Subtle background detail */}
                        <div className="absolute top-0 right-0 p-4">
                            <div className="w-20 h-20 border border-[#72383D] rounded-full opacity-20 -mr-10 -mt-10"></div>
                        </div>

                        <FileText className="w-12 h-12 text-[#72383D] mb-8" />
                        <h3 className="text-2xl font-serif text-[#F2F2EB] font-medium mb-4">Free Financial Plan</h3>
